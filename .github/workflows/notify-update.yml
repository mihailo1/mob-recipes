name: Notify update

# Sends one "new version" Web Push after a Production deploy that ships a new
# app version. Vercel's GitHub integration emits deployment_status events.
# The server enforces the real limits (max one push per 24h, device cap), so
# this workflow only decides WHEN to call it.
#
# The job fails (and the version tag is NOT created) whenever notify answers
# anything but HTTP 200. A 502 means devices exist but none received the
# push; re-run it with the manual workflow below.
#
# A manual run (workflow_dispatch) with `force` set bypasses the server's
# 24h limit and the "already sent" check, and ignores an existing version
# tag. Use it only to test.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      force:
        description: "Force: bypass the 24h limit and the already-sent check (testing only)"
        type: boolean
        required: false
        default: false
      message:
        description: "Custom text: send this message instead of the update alert (max 200 chars)"
        type: string
        required: false
        default: ""
      title:
        description: "Custom text title (optional, max 60 chars, default Mob Recipes)"
        type: string
        required: false
        default: ""
      url:
        description: "Custom text: page to open on tap (optional, a path like /pool)"
        type: string
        required: false
        default: ""
      icon:
        description: "Custom text: image to show (optional, a path like /push/kitten-192.png, files under public/push/ only)"
        type: string
        required: false
        default: ""

permissions:
  contents: write # only to push the v<version> tag

concurrency:
  group: notify-update
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
      FORCE: ${{ github.event.inputs.force == 'true' }}
      MESSAGE: ${{ github.event.inputs.message }}
      SITE: https://mob-recipes.vercel.app
    steps:
      - name: Check setup
        id: gate
        run: |
          if [ -z "$NOTIFY_SECRET" ]; then
            echo "Update alerts are not set up"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout deployed commit
        if: steps.gate.outputs.go == 'true' && env.MESSAGE == ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          fetch-depth: 1

      - name: Read version and check tag
        id: ver
        if: steps.gate.outputs.go == 'true' && env.MESSAGE == ''
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected version format"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            if [ "$FORCE" != "true" ]; then
              echo "Version $VERSION was already handled (tag v$VERSION exists). Nothing to do."
              echo "go=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Wait for the new version to be live
        if: steps.gate.outputs.go == 'true' && steps.ver.outputs.go == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          for i in $(seq 1 18); do
            if curl -fsS -m 15 "$SITE/sw.js?cb=$(date +%s)" | grep -qF "const VERSION = \"$VERSION\""; then
              echo "Version $VERSION is live"
              exit 0
            fi
            echo "Waiting for version $VERSION ($i/18)"
            sleep 10
          done
          echo "Version $VERSION did not go live in time"
          exit 1

      - name: Send custom message
        # Hand-written text from a manual run. Not an update alert: no version
        # checks, no daily limit, no tag.
        if: steps.gate.outputs.go == 'true' && env.MESSAGE != ''
        env:
          TITLE: ${{ github.event.inputs.title }}
          URL_PATH: ${{ github.event.inputs.url }}
          ICON_PATH: ${{ github.event.inputs.icon }}
        run: |
          BODY=$(jq -cn --arg b "$MESSAGE" --arg t "$TITLE" --arg u "$URL_PATH" --arg i "$ICON_PATH" \
            '{custom: ({body: $b} + (if $t != "" then {title: $t} else {} end) + (if $u != "" then {url: $u} else {} end) + (if $i != "" then {icon: $i} else {} end))}')
          OUT=$(mktemp)
          CODE=$(curl -sS -m 30 -o "$OUT" -w '%{http_code}' -X POST "$SITE/api/push/notify" \
            -H "Authorization: Bearer $NOTIFY_SECRET" \
            -H "content-type: application/json" \
            -d "$BODY") || CODE="curl-error"
          RESPONSE=$(head -c 500 "$OUT")
          if [ "$CODE" != "200" ]; then
            echo "Notify failed (HTTP $CODE): $RESPONSE"
            exit 1
          fi
          echo "Notify response: $RESPONSE"

      - name: Send push
        if: steps.gate.outputs.go == 'true' && steps.ver.outputs.go == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          BODY=$(printf '{"version":"%s","force":%s}' "$VERSION" "$FORCE")
          OUT=$(mktemp)
          CODE=$(curl -sS -m 30 -o "$OUT" -w '%{http_code}' -X POST "$SITE/api/push/notify" \
            -H "Authorization: Bearer $NOTIFY_SECRET" \
            -H "content-type: application/json" \
            -d "$BODY") || CODE="curl-error"
          RESPONSE=$(head -c 500 "$OUT")
          if [ "$CODE" != "200" ]; then
            echo "Notify failed (HTTP $CODE): $RESPONSE"
            exit 1
          fi
          echo "Notify response: $RESPONSE"

      - name: Tag the version as handled
        # success() is explicit: a failed notify must never create the tag.
        if: success() && steps.gate.outputs.go == 'true' && steps.ver.outputs.go == 'true' && steps.ver.outputs.tag_exists != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
