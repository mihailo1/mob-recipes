<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Offline</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #fafaf6;
    color: #20221d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  main { max-width: 340px; }
  h1 { margin: 0 0 10px; font-size: 24px; }
  p { margin: 0 0 22px; color: #686b61; font-size: 15px; line-height: 1.5; }
  a {
    display: inline-block;
    padding: 12px 22px;
    border-radius: 999px;
    background: #303b24;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
  }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>This page isn't saved on your device. Recipes you've opened before are still available.</p>
  <a href="/">Go to recipes</a>
</main>
</body>
</html>
